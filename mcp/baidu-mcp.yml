source: https://github.com/baidu-maps/mcp
server:
  name: baidu-maps
  official: true
  license: MIT
  transport: [http, sse, stdio]
  hosted:
    streamable_http: https://mcp.map.baidu.com/mcp
    sse: https://mcp.map.baidu.com/sse
