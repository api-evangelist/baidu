aid: baidu
name: Baidu
description: >-
  Baidu is a leading Chinese internet and artificial-intelligence company whose developer
  surface spans three main product lines. Baidu AI Cloud "Qianfan" is a Model-as-a-Service
  platform hosting the ERNIE model family behind an OpenAI-compatible REST API for chat,
  embeddings, and agent building (AppBuilder). The Baidu AI Open Platform exposes OCR, NLP,
  speech, face, image, and knowledge-graph APIs. The Baidu Maps Open Platform (LBS) provides
  geocoding, place search, route planning, weather, and real-time traffic to millions of
  registered developers, and ships an official Model Context Protocol (MCP) server with a
  hosted remote endpoint. This profile was surfaced as a portfolio company and enriched with
  real, first-party developer artifacts.
